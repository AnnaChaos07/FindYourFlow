services:
  website:
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile_app
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - anna_node_modules:/app/node_modules
      - anna_next:/app/.next
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"

volumes:
  anna_node_modules:
  anna_next:
